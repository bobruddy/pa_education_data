name: Bug on the site
description: The site’s behavior or layout is broken.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what the page did and what you expected. A free GitHub account is required to submit this.
  - type: input
    id: url
    attributes:
      label: Page URL
      description: The address in the browser when it broke.
      placeholder: "https://pdenumbers.org/"
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Browser and version, if it might matter.
      placeholder: "Safari 18, Firefox 134, Chrome 131"
    validations:
      required: false
  - type: textarea
    id: build
    attributes:
      label: Build
      description: Commit and build time from the site. Leave this as-is.
    validations:
      required: false
